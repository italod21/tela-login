<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        
    <h1>Bem-vindo de volta</h1>

    <div class="container-input">
        <label for="email" class="font">E-mail</label>
        <input id="email" type="email" name="email" />
    </div>

    <div class="container-input">
        <label for="senha" class="font">Senha</label>
        <input id="senha" type="password" name="senha" />
    </div>

    <div class="container-checkbox">
        <div class="container-input-checkbox">
            <input id="lembrar" type="checkbox" name="lembrar"/>
            <label for="lembrar" class="font">Lembrar-me</label>
        </div>
        <a href="" class="font">Esqueceu a senha?</a>
    </div>

    <button type="submit">Entrar</button>

    <p class="font">Ainda não possui uma conta?
        <a href="" class="font">Cadastre-se</a>
    </p>
   
     </form>
    
</body>
</html>
